<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80" role="img" aria-label="Irish Van Man" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ivmBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecea"/>
    </linearGradient>
  </defs>
  <!-- road -->
  <rect x="4" y="64" width="112" height="5" rx="2.5" fill="#f0a33c"/>
  <!-- van body -->
  <path d="M10 26 h58 a4 4 0 0 1 4 4 v6 h12 l16 14 v10 a4 4 0 0 1-4 4 H14 a4 4 0 0 1-4-4 V30 a4 4 0 0 1 4-4 z"
        fill="url(#ivmBody)" stroke="#0b5138" stroke-width="3" stroke-linejoin="round"/>
  <!-- cab window -->
  <path d="M72 38 h10 l11 10 h-21 z" fill="#0e4f62" stroke="#0b5138" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- side panel stripe -->
  <rect x="17" y="34" width="46" height="4" rx="2" fill="#127a52"/>
  <rect x="17" y="42" width="30" height="4" rx="2" fill="#f0a33c"/>
  <!-- wheels -->
  <circle cx="30" cy="64" r="9" fill="#1b2b2b"/>
  <circle cx="30" cy="64" r="3.5" fill="#f4f1ea"/>
  <circle cx="86" cy="64" r="9" fill="#1b2b2b"/>
  <circle cx="86" cy="64" r="3.5" fill="#f4f1ea"/>
  <!-- shamrock-ish clover mark on the panel -->
  <g fill="#127a52" transform="translate(56 50) scale(0.9)">
    <circle cx="0" cy="-4" r="3.1"/>
    <circle cx="-4" cy="1" r="3.1"/>
    <circle cx="4" cy="1" r="3.1"/>
    <path d="M0 2 l0 7" stroke="#127a52" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
